<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#050505">
  <meta name="description" content="WYAGNM — Video Editor / Creative. Raw footage into edits that stop the scroll.">

  <title>WYAGNM. — Video Editor / Creative</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background: #050505;
      color: #f5f5f5;
      font-family: Arial, Helvetica, sans-serif;
      overflow-x: hidden;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button,
    a {
      -webkit-tap-highlight-color: transparent;
    }

    .page {
      width: 100%;
      overflow: hidden;
    }

    /* NAV */

    header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 100;
      padding: 22px 5vw;
      display: flex;
      align-items: center;
      justify-content: space-between;
      mix-blend-mode: difference;
    }

    .logo {
      font-size: 20px;
      font-weight: 900;
      letter-spacing: -1px;
    }

    nav {
      display: flex;
      gap: 28px;
      font-size: 11px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    nav a {
      opacity: .75;
      transition: .25s;
    }

    nav a:hover {
      opacity: 1;
    }

    /* HERO */

    .hero {
      min-height: 100vh;
      padding: 150px 5vw 70px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      position: relative;
    }

    .eyebrow {
      font-size: 11px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #888;
      margin-bottom: 25px;
    }

    .hero h1 {
      font-size: clamp(65px, 14vw, 190px);
      line-height: .78;
      letter-spacing: -0.075em;
      font-weight: 900;
      text-transform: uppercase;
      max-width: 1200px;
    }

    .hero h1 span {
      display: block;
    }

    .hero h1 .outline {
      color: transparent;
      -webkit-text-stroke: 1px #777;
    }

    .hero-bottom {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 30px;
      margin-top: 70px;
      max-width: 1100px;
    }

    .hero-copy {
      max-width: 470px;
      color: #999;
      font-size: 17px;
      line-height: 1.55;
    }

    .cta {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: #f5f5f5;
      color: #050505;
      padding: 18px 24px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1.5px;
      transition: transform .25s, background .25s;
      white-space: nowrap;
    }

    .cta:hover {
      transform: translateY(-4px);
      background: white;
    }

    .scroll-line {
      position: absolute;
      bottom: 30px;
      right: 5vw;
      font-size: 9px;
      letter-spacing: 2px;
      color: #555;
      writing-mode: vertical-rl;
      text-transform: uppercase;
    }

    /* GENERAL */

    section {
      padding: 120px 5vw;
      border-top: 1px solid #191919;
    }

    .section-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 30px;
      margin-bottom: 55px;
    }

    .section-number {
      font-size: 10px;
      letter-spacing: 2px;
      color: #666;
    }

    .section-title {
      font-size: clamp(42px, 7vw, 100px);
      line-height: .9;
      letter-spacing: -.06em;
      text-transform: uppercase;
      font-weight: 900;
      max-width: 900px;
    }

    .section-description {
      max-width: 350px;
      color: #777;
      font-size: 14px;
      line-height: 1.6;
    }

    /* FEATURE */

    .feature {
      position: relative;
      min-height: 540px;
      background:
        radial-gradient(circle at 25% 35%, #292929 0, transparent 30%),
        radial-gradient(circle at 75% 65%, #202020 0, transparent 32%),
        linear-gradient(135deg, #111 0%, #050505 60%);
      border: 1px solid #262626;
      overflow: hidden;
      display: flex;
      align-items: flex-end;
      padding: 45px;
    }

    .feature::before {
      content: "WYAGNM";
      position: absolute;
      top: -45px;
      right: -30px;
      font-size: clamp(100px, 20vw, 280px);
      font-weight: 900;
      letter-spacing: -.1em;
      color: #111;
      pointer-events: none;
    }

    .feature-grid {
      position: absolute;
      inset: 35px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: repeat(2, 1fr);
      gap: 8px;
      opacity: .75;
    }

    .feature-tile {
      border: 1px solid #292929;
      background: linear-gradient(145deg, #1b1b1b, #080808);
      position: relative;
      overflow: hidden;
    }

    .feature-tile::after {
      content: "";
      position: absolute;
      width: 120%;
      height: 2px;
      background: #555;
      transform: rotate(-25deg);
      top: 50%;
      left: -10%;
      opacity: .5;
    }

    .feature-content {
      position: relative;
      z-index: 3;
    }

    .feature-kicker {
      font-size: 10px;
      letter-spacing: 3px;
      color: #999;
      margin-bottom: 12px;
      text-transform: uppercase;
    }

    .feature h3 {
      font-size: clamp(48px, 8vw, 110px);
      line-height: .82;
      letter-spacing: -.07em;
      text-transform: uppercase;
      font-weight: 900;
    }

    .feature h3 span {
      color: #777;
    }

    /* WORK TYPES */

    .work-list {
      border-top: 1px solid #252525;
    }

    .work-item {
      min-height: 90px;
      padding: 25px 0;
      border-bottom: 1px solid #252525;
      display: grid;
      grid-template-columns: 60px 1fr auto;
      align-items: center;
      gap: 20px;
      transition: padding .25s, background .25s;
    }

    .work-item:hover {
      padding-left: 15px;
      padding-right: 15px;
      background: #0d0d0d;
    }

    .work-num {
      color: #555;
      font-size: 11px;
    }

    .work-name {
      font-size: clamp(22px, 4vw, 45px);
      font-weight: 800;
      letter-spacing: -.04em;
      text-transform: uppercase;
    }

    .work-arrow {
      color: #777;
      font-size: 20px;
    }

    /* OFFER */

    .offer {
      background: #f2f2f2;
      color: #050505;
      padding: 70px 6vw;
      position: relative;
      overflow: hidden;
    }

    .offer-label {
      font-size: 10px;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 20px;
    }

    .offer h2 {
      font-size: clamp(65px, 13vw, 180px);
      line-height: .76;
      letter-spacing: -.08em;
      text-transform: uppercase;
      font-weight: 900;
      max-width: 1100px;
    }

    .offer h2 span {
      display: block;
    }

    .offer-details {
      margin-top: 60px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 30px;
      border-top: 1px solid #bbb;
      padding-top: 25px;
    }

    .offer-details p {
      max-width: 500px;
      font-size: 15px;
      line-height: 1.5;
    }

    .price {
      font-size: clamp(35px, 6vw, 70px);
      font-weight: 900;
      letter-spacing: -.06em;
      white-space: nowrap;
    }

    .dark-cta {
      display: inline-flex;
      background: #050505;
      color: #fff;
      padding: 18px 25px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1.5px;
      margin-top: 30px;
    }

    /* PROCESS */

    .process {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1px;
      background: #252525;
      border: 1px solid #252525;
    }

    .process-card {
      background: #050505;
      padding: 35px;
      min-height: 250px;
    }

    .process-card small {
      color: #555;
      font-size: 10px;
      letter-spacing: 2px;
    }

    .process-card h3 {
      margin-top: 70px;
      font-size: 25px;
      letter-spacing: -.04em;
      text-transform: uppercase;
    }

    .process-card p {
      color: #777;
      font-size: 13px;
      line-height: 1.5;
      margin-top: 12px;
    }

    /* CONTACT */

    .contact {
      min-height: 70vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .contact h2 {
      font-size: clamp(65px, 13vw, 180px);
      line-height: .78;
      letter-spacing: -.08em;
      text-transform: uppercase;
      font-weight: 900;
    }

    .contact-bottom {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 30px;
      margin-top: 80px;
    }

    .contact-info {
      display: flex;
      flex-direction: column;
      gap: 12px;
      color: #888;
      font-size: 13px;
    }

    .contact-info a:hover {
      color: white;
    }

    footer {
      border-top: 1px solid #191919;
      padding: 25px 5vw;
      display: flex;
      justify-content: space-between;
      color: #555;
      font-size: 9px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    /* MOBILE */

    @media (max-width: 700px) {

      header {
        padding: 20px;
      }

      nav {
        gap: 12px;
        font-size: 9px;
      }

      .hero {
        padding: 130px 20px 70px;
      }

      .
